<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cotizaciones</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- El contenedor que se va a capturar -->
        <div id="capture-area" class="capture-card">
            <h1 class="title">COTIZACIÓN</h1>
            <div class="table-header">
                <div class="col-moneda">MONEDA</div>
                <div class="col-compra">COMPRA</div>
                <div class="col-venta">VENTA</div>
            </div>
            <div class="table-body" id="quotes-container">
                <!-- Se llenará con JS -->
            </div>
        </div>

        <div class="controls">
            <button id="btn-share" class="btn primary-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                Compartir por WhatsApp
            </button>
            <button id="btn-download" class="btn secondary-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Guardar Imagen
            </button>
        </div>
    </div>
    
    <div id="loading" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Generando imagen...</p>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('Service Worker registrado', reg);
                }).catch(err => {
                    console.error('Error al registrar Service Worker', err);
                });
            });
        }
    </script>
</body>
</html>
